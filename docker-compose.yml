# Intra Platform — full stack: web (TanStack Start), api (NestJS),
# postgres, redis. Web + API sit behind Traefik on the shared external
# `web` network; postgres/redis stay on the private `backend` network.
#
# Same-origin routing: the browser calls /api/* on the same host, which
# Traefik forwards to the API — so there is no cross-origin CORS/cookie issue.
#
# Requires Traefik already running with an external network named `web`,
# an entrypoint `websecure`, and a cert resolver `letsencrypt`.
#
# Production host: set APP_HOST=platform.intra.ca and LEGACY_APP_HOST=ops-test.intra.ca
# on the server .env (same Compose project `intra-ops-test` — one DB/volume set).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF + named volume persist queue/session data across restarts.
    # WARNING: `docker compose down -v` deletes redisdata — PostgreSQL reconciler can rebuild scheduled jobs.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      APP_HOST: ${APP_HOST}
      APP_PUBLIC_URL: https://${APP_HOST}
      LEGACY_APP_HOST: ${LEGACY_APP_HOST}
      CORS_ORIGINS: https://${APP_HOST},https://${LEGACY_APP_HOST}
      SESSION_COOKIE_SECURE: "true"
      CARER_PORTAL_ENABLED: ${CARER_PORTAL_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - web
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # API takes priority for /api on the primary app host.
      - traefik.http.routers.intra-platform-api.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.intra-platform-api.entrypoints=websecure
      - traefik.http.routers.intra-platform-api.tls.certresolver=letsencrypt
      - traefik.http.routers.intra-platform-api.priority=100
      - traefik.http.routers.intra-platform-api.middlewares=intra-platform-sec@docker
      - traefik.http.routers.intra-platform-api.service=intra-platform-api
      - traefik.http.services.intra-platform-api.loadbalancer.server.port=8000
      # Shared security-headers middleware (L3).
      - traefik.http.middlewares.intra-platform-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.intra-platform-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.intra-platform-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.intra-platform-sec.headers.browserXssFilter=true
      - traefik.http.middlewares.intra-platform-sec.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.intra-platform-sec.headers.frameDeny=true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NITRO_PRESET: node-server
        # Empty => same-origin /api calls (routed to api by Traefik).
        VITE_API_URL: ""
        VITE_CARER_PORTAL_ENABLED: ${VITE_CARER_PORTAL_ENABLED:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      - api
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.intra-platform-web.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.intra-platform-web.entrypoints=websecure
      - traefik.http.routers.intra-platform-web.tls.certresolver=letsencrypt
      - traefik.http.routers.intra-platform-web.priority=1
      - traefik.http.routers.intra-platform-web.middlewares=intra-platform-sec@docker
      - traefik.http.routers.intra-platform-web.service=intra-platform-web
      - traefik.http.services.intra-platform-web.loadbalancer.server.port=3000
      # Permanent redirect from legacy host (ops-test.intra.ca) to APP_HOST; TLS via letsencrypt.
      - traefik.http.middlewares.intra-platform-legacy-redirect.redirectregex.regex=^https?://[^/]+/?(.*)$
      - traefik.http.middlewares.intra-platform-legacy-redirect.redirectregex.replacement=https://${APP_HOST}/$${1}
      - traefik.http.middlewares.intra-platform-legacy-redirect.redirectregex.permanent=true
      - traefik.http.routers.intra-platform-legacy.rule=Host(`${LEGACY_APP_HOST}`)
      - traefik.http.routers.intra-platform-legacy.entrypoints=websecure
      - traefik.http.routers.intra-platform-legacy.tls.certresolver=letsencrypt
      - traefik.http.routers.intra-platform-legacy.priority=200
      - traefik.http.routers.intra-platform-legacy.middlewares=intra-platform-legacy-redirect@docker
      - traefik.http.routers.intra-platform-legacy.service=intra-platform-web

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      APP_PUBLIC_URL: https://${APP_HOST}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      DOCUMENT_SHARE_SIGNING_SECRET: ${DOCUMENT_SHARE_SIGNING_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      COMMUNICATIONS_WORKER_CONCURRENCY: ${COMMUNICATIONS_WORKER_CONCURRENCY:-5}
      COMMUNICATIONS_RETRY_ATTEMPTS: ${COMMUNICATIONS_RETRY_ATTEMPTS:-5}
      COMMUNICATIONS_RECONCILE_CRON: ${COMMUNICATIONS_RECONCILE_CRON:-*/10 * * * *}
      COMMUNICATIONS_QUEUE_PREFIX: ${COMMUNICATIONS_QUEUE_PREFIX:-intra}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:
  redisdata:

networks:
  web:
    external: true
  backend:
    driver: bridge
